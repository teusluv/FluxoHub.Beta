services:

  # ==========================================================================
  # PostgreSQL 15
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: fluxohub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fluxohub_db}
      POSTGRES_USER: ${POSTGRES_USER:-fluxohub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fluxohub_user} -d ${POSTGRES_DB:-fluxohub_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fluxohub_network

  # ==========================================================================
  # MinIO (S3-compatible) — armazenamento de imagens de canhotos
  # ==========================================================================
  minio:
    image: minio/minio:latest
    container_name: fluxohub_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - fluxohub_network

  # ==========================================================================
  # MinIO Setup — cria o bucket inicial automaticamente
  # ==========================================================================
  minio-setup:
    image: minio/mc:latest
    container_name: fluxohub_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-dev_password};
        mc mb --ignore-existing local/${MINIO_BUCKET_CANHOTOS:-canhotos};
        mc anonymous set none local/${MINIO_BUCKET_CANHOTOS:-canhotos};
        echo 'MinIO setup completo — bucket criado com acesso privado';
      "
    networks:
      - fluxohub_network

  # ==========================================================================
  # Adminer — UI web para inspecionar o PostgreSQL em dev
  # ==========================================================================
  adminer:
    image: adminer:latest
    container_name: fluxohub_adminer
    restart: unless-stopped
    ports:
      - "8888:8080"
    depends_on:
      - postgres
    networks:
      - fluxohub_network

  # ==========================================================================
  # Backend (Spring Boot) — só sobe em produção / quando imagem está buildada
  # Em dev, rode diretamente com ./mvnw spring-boot:run
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fluxohub_backend
    restart: unless-stopped
    profiles: ["production"]   # não sobe com 'docker-compose up' sem --profile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fluxohub_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fluxohub_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dev_password}
      MINIO_BUCKET: ${MINIO_BUCKET_CANHOTOS:-canhotos}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY_MS: ${JWT_ACCESS_EXPIRY_MS:-900000}
      JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS:-604800000}
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fluxohub_network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  fluxohub_network:
    driver: bridge
