# =============================================================================
# Configuração BASE (compartilhada por todos os profiles)
# =============================================================================

spring:
  profiles:
    active: dev
  application:
    name: pod-backend

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway gerencia o schema; Hibernate só valida
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public
        jdbc:
          time_zone: UTC          # Sempre armazenar em UTC; converter na camada de apresentação

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false           # Migrations devem ser sequenciais; sem pular versões

  # Upload multipart (imagens de canhoto)
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB         # Aceita até 10MB; o mobile comprime para max 1MB antes de enviar
      max-request-size: 50MB      # Batch sync pode mandar múltiplas imagens

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

# =============================================================================
# Segurança / JWT
# =============================================================================
pod:
  jwt:
    secret: ${JWT_SECRET:ZGV2U2VjcmV0S2V5UGFyYURlc2Vudm9sdmltZW50b0xvY2FsUG9kU2lzdGVtYTIwMjQ=}
    access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}       # 15 minutos
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}  # 7 dias

  # MinIO / S3
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:dev_password}
    bucket: ${MINIO_BUCKET:canhotos}
    # URLs assinadas expiram em 15 minutos — nunca URL pública
    presigned-url-expiry-minutes: 15

  # OCR
  ocr:
    provider: google-cloud-vision   # fallback: tesseract (configurado por profile)
    confidence-threshold: 0.70      # abaixo disso, marca para revisão manual
    google:
      project-id: ${GOOGLE_CLOUD_PROJECT_ID:}

  # WhatsApp
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    # Rate limit: máximo de consultas por telefone por minuto
    rate-limit-requests-per-minute: 10

  # Alertas
  alerts:
    # Horas sem canhoto após data_entrega_real para disparar alerta
    hours-without-canhoto: 6

# =============================================================================
# Actuator (health check para Docker restart policy)
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true

# =============================================================================
# API Docs (Springdoc / OpenAPI)
# =============================================================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# =============================================================================
# Logging — estruturado JSON em prod, legível em dev
# Veja logback-spring.xml para configuração por profile
# =============================================================================
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    br.com.pod: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
