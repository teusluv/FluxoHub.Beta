name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    name: Build, Lint & Test (Java 21)
    runs-on: ubuntu-latest

    # Testcontainers precisa do Docker daemon disponível no runner
    services:
      docker:
        image: docker:dind
        options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Checkstyle como "lint" — valida estilo de código sem compilar tudo
      - name: Lint (Checkstyle)
        run: |
          cd backend
          ./mvnw checkstyle:check -q

      # Testes unitários (rápidos, sem Docker)
      - name: Unit Tests
        run: |
          cd backend
          ./mvnw test -pl . -q

      # Testes de integração (Testcontainers sobe Postgres + MinIO reais)
      - name: Integration Tests
        run: |
          cd backend
          ./mvnw failsafe:integration-test failsafe:verify -q
        env:
          # Testcontainers usa DOCKER_HOST do ambiente
          TESTCONTAINERS_RYUK_DISABLED: true

      # Build da imagem Docker para validar o Dockerfile
      - name: Build Docker image
        run: |
          cd backend
          docker build -t pod-backend:ci .

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/target/surefire-reports/
          retention-days: 7
